[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.1.0"
description = "Deterministic research loop for automated quantitative strategy R&D."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18",
  "bt>=1.1",
  "duckdb>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quant-agent = "quant_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_core*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
