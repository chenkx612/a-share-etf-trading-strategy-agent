id = "liquid-etf-rerank-topk"
goal = """
继续研发面向 universes/liquid_etf_rotation.csv 的纯多头 ETF 横截面精排策略。本任务已经完成 0→1：当前 Champion 是“中期动量 Top-N + 逆波动 Top-N”的双袖套组合，按 mom_sleeve_weight 合并权重，使用 90/120 日动量、60 日波动率、Top-1/Top-2 和可选收益/波动打分。新一轮必须以任务级 Champion 为父版本做增量研发，不得重新建立无关基线，也不得修改或绕过固定 evaluator。

历史研究边界：此前已测试且不应原样重复的机制包括窗口最大回撤调整动量、正收益日占比加权动量、下行半波动防御袖套、Sortino 风格动量、对数价格趋势 t 统计量，以及仅对所有资产减去同一截面均值但不改变排序的伪相对动量。这些结果只能说明对应实现未晋级，不能扩展为对整个特征族的否定；但下一轮若再次触及相近机制，必须说明新的排序信息、持仓行为和失败模式与旧实现有何本质差异。不得把精确 Gate 指标、Gate 月份或 Gate 持仓反馈给候选研发；后续假设、调试和取舍只能使用 Development 输入与 Harness 已提供的接受/拒绝结论。

三轮研究预算按以下优先级推进，每轮只验证一个主要机制，并在同轮内尽快收敛，不得把多个方向捆绑成一个候选：

1. 优先验证入选/保留迟滞。利用 Champion 已有但网格固定为 0 的 rank_buffer，只对动量袖套测试极小的缓冲范围，目标是减少临界名次来回切换，同时保持信号响应和总暴露。候选网格必须包含无缓冲行为作为邻近对照；提交前报告不同持仓日、动量袖套换名次数和平均换手率，而不是仅报告汇总 Sortino。
2. 若迟滞在 Development 没有稳健改善，研究双袖套重合导致的单 ETF 集中。比较允许重合与防御袖套选择下一只合格、非动量袖套 ETF 的透明规则；始终保持满额纯多头，不得用降仓或空仓伪造风险改善。只允许因果滚动相关性作为必要的平局或冗余判据，不做大阈值搜索。
3. 若前两项均无效，再研究真正改变截面次序的相对趋势：例如先在每个历史交易日对收益做当日可得的横截面中位数去除，再在过去窗口累计相对收益。该信号必须与简单地从最终窗口收益减去同一个截面常数区分，清楚处理每日缺失资产和动态准入，并保留逆波动防御袖套不变。

候选池只由配置的 universe 决定，并按每只 ETF 在信号日的真实可用历史动态准入。新上市或历史不足的 ETF 不得借用上市前数据；fund_size 只用于固定池成员身份审计，不得作为历史特征、权重或阈值。缺失行情不得向后填充或用未来值补齐；当日无有效收盘或必要窗口不足的资产必须排除。当前池带有幸存者偏差，本任务不声称消除该偏差。

所有特征和组合决策必须在交易日 t 收盘后仅使用 t 及此前已获得的 OHLCV/amount/turnover 数据，输出 t 的目标权重，由 Harness 在 t+1 开盘成交。禁止使用未来收益、全样本统计量、Gate 信息、做空、杠杆、未来成分回填或盘中不可得信息。截面尺度处理必须按信号日独立完成，或只用过去滚动窗口拟合；并列按 symbol 升序确定性打破。

策略模块必须实现 select(daily, universe, start, end)、parameter_grid() 和 select_with_params(daily, universe, start, end, params)，返回至少包含 date、symbol、target_weight 的 DataFrame。每日权重必须有限、非负、总和不超过 1；有效资产不足时允许保留剩余现金。无持仓日仍要通过 attrs 中的 signal_dates 和 universe_symbols 表达完整状态，避免回测延续旧仓位。生产默认参数必须明确且可每日复算。

参数必须少、有经济含义、网格确定且不超过 Harness 上限；优先固定 Champion 已稳定选择的维度，只为本轮新机制加入极少邻近值，避免重新搜索整套参数。每个候选在 Development 内必须检查无未来函数、边界窗口、动态上市日期、缺失值、确定性、网格唯一性、纯多头权重、信号日至次日开盘时序，以及相对 Champion 的行为差异。只有改善来自多个预先存在的滚动折、不是单一阶段或持续降低暴露，才值得提交。

固定评测按 18 个月训练窗口逐折选参，在随后 1 个月验证折计算样本外表现；Development 与 Gate 不重叠。候选必须先满足所有 Gate 折训练可行性及 Gate 汇总年化收益、最大回撤、平均换手率硬约束，再以 Sortino 相对当前 Champion 达到最小改善门槛。Promotion 完全由 Harness 决定；不得修改 universe、市场数据、回测器、评测区间、指标、约束、晋级逻辑或测试来配合候选。
"""

[budget]
max_rounds = 3
max_hours = 3
max_consecutive_failures = 3
round_minutes = 30

[opencode]
model = "xai/grok-4.5"
variant = "high"
timeout_minutes = 30

[strategy]
name = "liquid-etf-rerank-topk"
module = "quant_core.strategy.etf_rerank_topk"

[baseline]
mode = "none"

[data]
universe = "universes/liquid_etf_rotation.csv"

[scope]
editable = [
  "src/quant_core/strategy/etf_rerank_topk.py",
]
forbidden = [
  "src/quant_core/backtest/",
  "src/quant_core/data/",
  "src/quant_core/factors/",
  "src/quant_core/research/",
  "src/quant_core/cli.py",
  "src/quant_core/config.py",
  "tests/",
  "universes/",
  "data/",
  "outputs/",
  ".agents/",
  ".research/",
]

[commands]
test = ["{python}", "-m", "pytest", "-q", "tests/test_research_evaluator.py"]
metrics_path = "outputs/backtests/{run_id}/metrics.json"

[evaluation]
mode = "walk_forward"
objective = "sortino"

[evaluation.contract]
paths = [
  "pyproject.toml",
  "src/quant_core/__init__.py",
  "src/quant_core/backtest",
  "src/quant_core/config.py",
  "src/quant_core/data",
  "src/quant_core/factors",
  "src/quant_core/research",
  "src/quant_core/schedule.py",
  "src/quant_core/strategy/__init__.py",
  "src/quant_core/strategy/sharpe_corr_threshold.py",
  "tests/test_research_evaluator.py",
  "universes/liquid_etf_rotation.csv",
]

[evaluation.constraints]
annual_return = { operator = ">=", threshold = 0.03 }
max_drawdown = { operator = "abs<=", threshold = 0.20 }
avg_turnover = { operator = "<=", threshold = 0.35 }

[evaluation.acceptance]
minimum_improvement = 0.03

[evaluation.walk_forward]
train_months = 18
max_parameter_sets = 128

[evaluation.walk_forward.schedule]
period = "calendar_month"
interval = 1
trigger = "start"

[evaluation.walk_forward.development]
start = "2023-01-22"
end = "2025-07-21"

[evaluation.walk_forward.gate]
start = "2025-07-22"
end = "2026-07-21"
