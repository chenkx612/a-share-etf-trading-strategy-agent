id = "active-etf-rerank-topk"
goal = """
继续研发 active-etf-rerank-topk 任务管理的当前 Champion。新的 Loop 必须以 `.research/active-etf-rerank-topk/champion.py` 对应的已晋级策略为唯一比较基线，不再回到原 liquid-etf-rerank-topk、迁移前工作区版本或本任务 Run 001 的早期候选。所有候选只与 Harness 在本任务中管理的当前 Champion 比较，Promotion 仍完全由固定 evaluator 决定。

active_etf_rotation.csv 是当前时点筛出的高活跃、低同质化 ETF 快照，包含境内宽基、风格、行业主题、港股、美股和黄金等异质风险暴露，并有较多较新上市品种。候选池只能由该 CSV 决定，按每只 ETF 在信号日真实可用的历史动态准入。fund_size 只用于池成员身份审计，不得进入历史特征、打分、权重或阈值。不得借用上市前数据，不得对缺失行情前向或后向填充；当日无有效收盘或必要窗口不足的资产必须排除。该现时点池存在幸存者偏差，本任务不声称恢复历史成分或消除该偏差。

当前 Champion 来自 Run 001 / Round 006。它是纯多头双袖套组合：动量袖套选择逐日截面平均秩收益分位数完整窗口因果和的 Top-N，并可乘同窗口 Kaufman 效率比；防御袖套选择逆波动 Top-N；动量袖套使用轻量 `rank_buffer` 迟滞，两个袖套允许重合。生产默认参数为 `top_n=1`、`momentum_window=120`、`vol_window=60`、`min_history=120`、`mom_sleeve_weight=0.30`、`rank_buffer=1`、`use_relative_mom=True`、`use_efficiency_scale=True`、`use_sharpe=False`、`sleeve_dedup=False`。当前 walk-forward 网格只保留 `top_n∈{1,2}`、`momentum_window∈{90,120}` 与 `use_efficiency_scale∈{False,True}`；其余维度固定。

Run 001 的可继承研究记忆仅限机制和 Harness 结论：动量袖套 `rank_buffer` 迟滞与 Kaufman 效率比缩放先后晋级；袖套去重在 Development 上不如已晋级路径；mom/vol、低 beta 防御和 CAPM 残差动量未晋级，其中部分还破坏硬约束；硬波动或流动性门控、相关阈值、下行防御、双 horizon 动量、上行一致性、绝对动量为正过滤等探索没有形成可提交的 Development 优势。不得把 Run 001 的精确 Gate 指标、月份、逐折参数、持仓或收益路径用于本轮假设、调试、阈值选择或取舍，也不得为了已知 Gate 片段定制逻辑；只能使用 Development 诊断、上述接受/拒绝结论和 Harness 对本轮候选返回的非泄漏反馈。不要仅改名或轻微改写后重跑已否决机制，除非先给出新的、跨多个 Development 折的行为证据。

新一轮先用 Development 输入复核 Champion 的实际行为和两个已晋级机制的交互，包括逐折选参分布、`use_efficiency_scale` 相对控制的选中次数与持仓差异、效率比为零或接近零的频率、`rank_buffer` 保留与替换次数、不同持仓日、平均换手率、风险响应延迟、袖套重合率、持仓集中度、有效资产数以及空仓或不满仓日。诊断必须区分“参数被训练期选中”和“验证折稳健改善”，并确认收益改善不是单一阶段、少数 ETF 或持续降低暴露造成的。

研究按以下优先级推进，每轮只验证一个主要机制，并始终保留可复现的当前 Champion 对照：

1. 优先研究效率比缩放的时间尺度是否应与动量排序窗口解耦。以当前“同窗口效率比”为控制，只加入极少数有经济含义的邻近因果窗口；先证明它持续改变截面次序和持仓，而不是只改变分数尺度。不得同时改变效率比公式、分位数聚合、迟滞或袖套权重，也不得大范围搜索窗口。
2. 若独立效率窗口没有跨多个 Development 折的稳健优势，研究已晋级迟滞的风险响应。允许提出一个透明、无新数据源的单一退出/替换规则，使被 buffer 保留的动量持仓在当前效率缩放趋势显著恶化时不被机械滞留；必须保留当前 `rank_buffer=1` 行为作为对照，并报告换名、换手、持有期和退出延迟。不得叠加新的波动、beta、相关性或绝对动量门控。
3. 若迟滞响应修正无效，再研究逐日截面分位数聚合的轻量因果时序权重，例如一个固定的近期权重或极小的半衰期邻近网格，以检验异质主题趋势的时效性。必须与当前等权完整窗口聚合直接比较，保持完整窗口准入和确定性并列规则；不得重新引入已证伪的中位数共同平移、CAPM 残差或双 horizon 组合。
4. 只有前三项均缺乏 Development 证据时，才可提出一个与当前 Champion 未覆盖缺陷直接相关的单一机制。提交前必须说明它为何不等价于 Run 001 已失败的风险质量、防御去重或复杂门控路径，并用固定参数消融证明它在足够多日期真实改变选择。不要为了用完轮次提交弱候选。

所有特征和组合决策必须在交易日 t 收盘后仅使用 t 及此前可获得的 OHLCV/amount/turnover，输出 t 的目标权重，由 Harness 在 t+1 开盘成交。禁止使用未来收益、全样本统计量、Gate 信息、做空、杠杆、未来成分回填或盘中不可得信息。截面变换必须在每个历史信号日独立完成，或只用此前滚动窗口拟合；并列按 symbol 升序确定性打破。

策略模块必须实现 select(daily, universe, start, end)、parameter_grid() 和 select_with_params(daily, universe, start, end, params)，返回至少包含 date、symbol、target_weight 的 DataFrame。每日权重必须有限、非负、总和不超过 1；有效资产不足时允许保留剩余现金。无持仓日仍须通过 attrs 中的 signal_dates 和 universe_symbols 表达完整状态，避免回测延续旧仓位。生产默认参数必须明确、因果并可每日复算。

参数必须少、有经济含义、网格确定且不超过 Harness 上限。每轮应固定与主要机制无关且已稳定的维度，只加入少量邻近值；当前稳定的 `mom_sleeve_weight=0.30`、`vol_window=60`、允许袖套重合和禁用 `use_sharpe` 不应重新搜索。不得恢复整套历史参数网格来掩盖机制贡献。Development 内必须检查无未来函数、边界窗口、动态上市日期、缺失值、确定性、网格唯一性、纯多头权重、信号日至次日开盘时序，以及相对当前 Champion 的真实行为差异。只有改善来自多个预先存在的滚动折、不是单一阶段、少数标的或持续降低暴露，才值得提交。

固定评测按 18 个月训练窗口逐折选参，在随后 1 个月验证折计算样本外表现；Development 与 Gate 不重叠。候选必须先满足所有 Gate 折训练可行性及 Gate 汇总年化收益、最大回撤、平均换手率硬约束，再以 Sortino 相对本任务当前 Champion 达到最小改善门槛。Promotion 完全由 Harness 决定；不得修改 active_etf_rotation.csv、市场数据、回测器、评测区间、指标、约束、晋级逻辑或测试来配合候选。
"""

[budget]
max_rounds = 6
max_hours = 6
max_consecutive_failures = 3
round_minutes = 30

[opencode]
model = "xai/grok-4.5"
variant = "high"
timeout_minutes = 30

[strategy]
name = "active-etf-rerank-topk"
module = "quant_core.strategy.etf_rerank_topk"

[baseline]
mode = "workspace"

[data]
universe = "universes/active_etf_rotation.csv"

[scope]
editable = [
  "src/quant_core/strategy/etf_rerank_topk.py",
]
forbidden = [
  "src/quant_core/backtest/",
  "src/quant_core/data/",
  "src/quant_core/factors/",
  "src/quant_core/research/",
  "src/quant_core/cli.py",
  "src/quant_core/config.py",
  "tests/",
  "universes/",
  "data/",
  "outputs/",
  ".agents/",
  ".research/",
]

[commands]
test = ["{python}", "-m", "pytest", "-q", "tests/test_research_evaluator.py"]
metrics_path = "outputs/backtests/{run_id}/metrics.json"

[evaluation]
mode = "walk_forward"
objective = "sortino"

[evaluation.contract]
paths = [
  "pyproject.toml",
  "src/quant_core/__init__.py",
  "src/quant_core/backtest",
  "src/quant_core/config.py",
  "src/quant_core/data",
  "src/quant_core/factors",
  "src/quant_core/research",
  "src/quant_core/strategy/__init__.py",
  "src/quant_core/strategy/sharpe_corr_threshold.py",
  "tests/test_research_evaluator.py",
  "universes/active_etf_rotation.csv",
]

[evaluation.constraints]
annual_return = { operator = ">=", threshold = 0.03 }
max_drawdown = { operator = "abs<=", threshold = 0.20 }
avg_turnover = { operator = "<=", threshold = 0.35 }

[evaluation.acceptance]
minimum_improvement = 0.03

[evaluation.walk_forward]
train_months = 18
validation_months = 1
step_months = 1
max_parameter_sets = 128

[evaluation.walk_forward.development]
start = "2023-01-22"
end = "2025-07-21"

[evaluation.walk_forward.gate]
start = "2025-07-22"
end = "2026-07-21"
