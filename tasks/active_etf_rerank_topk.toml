id = "active-etf-rerank-topk"
long_name_reason = "Preserve the established task identity and its managed Champion history."
goal = """
继续研发 active-etf-rerank-topk 任务管理的当前 Champion。新的 Loop 必须以 `.research/active-etf-rerank-topk/champion.py` 对应的已晋级策略为唯一比较基线，不再回到原 liquid-etf-rerank-topk、迁移前工作区版本或本任务 Run 001 的早期候选。所有候选只与 Harness 在本任务中管理的当前 Champion 比较，Promotion 仍完全由固定 evaluator 决定。

active_etf_rotation.csv 是当前时点筛出的高活跃、低同质化 ETF 快照，包含境内宽基、风格、行业主题、港股、美股和黄金等异质风险暴露，并有较多较新上市品种。候选池只能由该 CSV 决定，按每只 ETF 在信号日真实可用的历史动态准入。fund_size 只用于池成员身份审计，不得进入历史特征、打分、权重或阈值。不得借用上市前数据，不得对缺失行情前向或后向填充；当日无有效收盘或必要窗口不足的资产必须排除。该现时点池存在幸存者偏差，本任务不声称恢复历史成分或消除该偏差。

当前 Champion 来自 Run 002 / Round 002，并已同步到生产策略文件。它仍是纯多头双袖套组合：动量袖套选择逐日截面平均秩收益分位数完整窗口因果和的 Top-N，乘同窗口 Kaufman 效率比，并可在效率缩放后的水平信号上使用因果加速度项；防御袖套选择逆波动 Top-N；动量袖套使用 `rank_buffer=1` 迟滞，两个袖套允许重合。生产默认参数为 `top_n=1`、`momentum_window=120`、`vol_window=60`、`min_history=120`、`mom_sleeve_weight=0.30`、`rank_buffer=1`、`use_relative_mom=True`、`use_efficiency_scale=True`、`use_sharpe=False`、`sleeve_dedup=False`、`mom_accel_lag=0`。当前 walk-forward 网格为 `top_n∈{1,2}`、`momentum_window∈{90,120}`、`mom_accel_lag∈{0,10,20}`，其余维度固定。

可继承研究记忆只限 Development 证据、机制结论与 Harness 决策，不得使用历史精确 Gate 指标、月份、逐折 Gate 参数、持仓或收益路径做新假设、调试、阈值选择或取舍。Run 001 中只有 `rank_buffer` 迟滞和 Kaufman 效率比缩放先后晋级；mom/vol、低 beta 防御、CAPM 残差动量、袖套去重及多种硬门控未晋级。Run 002 前两轮候选通过固定 evaluator 晋级，但 `report-facts.json` 均标记为 `combined_change`：Round 001 的半衰期聚合随后被移除，Round 002 同时移除半衰期并加入 `mom_accel_lag`，因此不得把最终提升唯一归因于“加速度”或任何单一改动。之后的秩稳定、成交量权重、信号峰值、自相关缩放、价格通道位置、信号抬升、低短期波动倾斜和再次袖套去重均未超过当前 Champion，其中部分 Development 表现较强但样本外明显失效。不要仅改名或轻微改写后重跑这些路径，除非先给出新的、跨多个 Development 折的行为证据。

当前 Champion 的 Development 选参分布给出明确但非因果的约束：`momentum_window=120` 在 30/30 折被选中；`top_n=1/2` 分别被选中 19/11 次；`mom_accel_lag=0/10/20` 分别被选中 13/5/12 次。新一轮必须先复核这些分布、固定参数下的持仓差异、`mom_accel_lag` 的实际启用频率、效率比为零或接近零的频率、`rank_buffer` 保留与替换次数、换手率、持有期、袖套重合率、集中度、有效资产数以及空仓或不满仓日。必须区分“训练期被选中”和“验证折稳健改善”，并确认任何改善不是单一阶段、少数 ETF、持续降暴露或额外换手造成的。

研究按以下优先级推进，每轮只验证一个主要机制，并始终保留可复现的当前 Champion 对照：

1. 第一优先级是将 Kaufman 效率比窗口与 120 日动量排序窗口解耦，以提高市场状态变化的响应速度，同时使用本任务新的 12 个月参数估计窗口。以当前“效率窗口等于动量窗口”为控制，只允许加入 60、90 日这两个有经济含义的较短因果窗口；优先固定 Development 从未选中的 `momentum_window=90`，避免用扩大网格掩盖机制贡献。不得同时改变效率比公式、分位数聚合、加速度公式、迟滞、袖套权重或防御袖套。提交前必须证明独立效率窗口在足够多日期真实改变截面次序和持仓，而不只是改变分数尺度，并按折报告被选中次数、持仓差异、换手、持有期、下行响应延迟和固定参数消融。
2. 若独立效率窗口没有跨多个 Development 折的稳健优势，研究 `rank_buffer` 与现有效率缩放的风险响应。只允许一个透明、无新数据源的退出或替换条件，使被 buffer 保留的动量持仓在短期效率显著恶化时不被机械滞留；必须保留原 `rank_buffer=1` 行为作为控制，并报告换名、换手、持有期和退出延迟。不得叠加波动、beta、相关性、成交量、绝对动量或现金门控。
3. 若前两项均无稳健 Development 证据，优先做网格简化和稳定性研究，而不是继续增加信号。检查移除 Development 从未选中的 `momentum_window=90` 是否保持行为与约束，并评估 `mom_accel_lag` 非零值的训练选择是否在验证折具有一致方向。纯粹不改变持仓或只减少计算量的候选不值得提交；网格简化必须有样本外稳定性或降低选参抖动的可审计收益。
4. 只有上述方向均失败时，才可提出一个与当前 Champion 未覆盖缺陷直接相关的单一机制。必须说明它为何不等价于两次历史 Run 已失败的后置缩放、风险质量、防御去重或复杂门控路径，并用固定参数消融证明它在足够多日期真实改变选择。不要为了用完轮次提交弱候选。

本任务现将生产和 walk-forward 参数估计窗口从 18 个月同步调整为 12 个月，验证折仍为 1 个月，以在覆盖约两个 120 日信号周期的同时提高市场状态敏感性。这是 evaluator/生产参数政策变更，会改变任务指纹并使既有 Champion 指标失效；Harness 必须先在新的 12 个月契约下重评当前 Champion，之后所有候选只与该同口径结果比较，历史 18 个月指标不得直接沿用。Development 继续固定为 2023-01-22 至 2025-07-21，历史 Gate 的任何日期不得回流到 Development；Gate 起点继续为 2025-07-22，只允许随新增、已冻结行情向后延长终点。不得在候选策略中进一步把训练窗缩短为 6 个月，也不得用历史 Gate 选择训练窗口。若未来重新评审窗口政策，必须在不接触 Gate 的独立 Development-only 契约实验中，对同一冻结 Champion、相同参数网格和相同滚动验证折比较候选窗口，并报告参数选择翻转率、相邻月份参数抖动、各折可行率、目标分布、换手、回撤及对单一主题阶段的依赖。

所有特征和组合决策必须在交易日 t 收盘后仅使用 t 及此前可获得的 OHLCV/amount/turnover，输出 t 的目标权重，由 Harness 在 t+1 开盘成交。禁止使用未来收益、全样本统计量、Gate 信息、做空、杠杆、未来成分回填或盘中不可得信息。截面变换必须在每个历史信号日独立完成，或只用此前滚动窗口拟合；并列按 symbol 升序确定性打破。

策略模块必须实现 select(daily, universe, start, end)、parameter_grid() 和 select_with_params(daily, universe, start, end, params)，返回至少包含 date、symbol、target_weight 的 DataFrame。每日权重必须有限、非负、总和不超过 1；有效资产不足时允许保留剩余现金。无持仓日仍须通过 attrs 中的 signal_dates 和 universe_symbols 表达完整状态，避免回测延续旧仓位。生产默认参数必须明确、因果并可每日复算。

参数必须少、有经济含义、网格确定且不超过 Harness 上限。每轮应固定与主要机制无关且已稳定的维度，只加入少量邻近值；当前稳定的 `mom_sleeve_weight=0.30`、`vol_window=60`、允许袖套重合和禁用 `use_sharpe` 不应重新搜索。不得恢复整套历史参数网格来掩盖机制贡献。Development 内必须检查无未来函数、边界窗口、动态上市日期、缺失值、确定性、网格唯一性、纯多头权重、信号日至次日开盘时序，以及相对当前 Champion 的真实行为差异。只有改善来自多个预先存在的滚动折、不是单一阶段、少数标的或持续降低暴露，才值得提交。

固定评测按 12 个月训练窗口逐折选参，在随后 1 个月验证折计算样本外表现；Development 与 Gate 不重叠。候选必须先满足所有 Gate 折训练可行性及 Gate 汇总年化收益、最大回撤、平均换手率硬约束，再以 Sortino 相对本任务当前 Champion 达到最小改善门槛。Promotion 完全由 Harness 决定；不得修改 active_etf_rotation.csv、市场数据、回测器、评测区间、指标、约束、晋级逻辑或测试来配合候选。
"""

[budget]
max_rounds = 10
max_hours = 10
max_consecutive_failures = 3
round_minutes = 30

[opencode]
model = "xai/grok-4.5"
variant = "high"

[execution]
command_timeout_minutes = 30

[strategy]
name = "active-etf-rerank-topk"

[baseline]
mode = "workspace"

[data]
universe = "universes/active_etf_rotation.csv"

[parameter_selection]
train_months = 12
objective = "sortino"
max_parameter_sets = 128

[parameter_selection.schedule]
period = "calendar_month"
interval = 1
trigger = "start"

[parameter_selection.constraints]
annual_return = { operator = ">=", threshold = 0.03 }
max_drawdown = { operator = "abs<=", threshold = 0.20 }
avg_turnover = { operator = "<=", threshold = 0.35 }

[production]
curve_months = 12
benchmark = "510300"

[scope]
editable = [
  "src/quant_core/strategy/etf_rerank_topk.py",
]

[commands]
tests = ["tests/test_research_evaluator.py"]

[evaluation]
mode = "walk_forward"

[evaluation.acceptance]
minimum_improvement = 0.03

[evaluation.guard]
benchmark = "universe_equal_weight"
max_excess_annual_return_degradation = 0.10

[evaluation.walk_forward.relative]
anchor = "latest_complete_universe_date"
development_months = 30
gate_months = 12
guard_months = 6
