id = "sharpe-corr-threshold-optimization"
long_name_reason = "Preserve the established task identity and its managed Champion history."
goal = """
以 Harness 管理的当前 Champion 为唯一比较起点，继续优化纯多头 ETF 行业轮动策略，不得从工作区原始策略重新开始。当前 Champion 使用 25 日 Sharpe 排序、正分过滤、100 日相关性阈值 0.9、10% 单日止损；当等权 ETF 宇宙的 10 日/60 日实现波动率比超过 1.3 时，持仓数由 5 降为 3、总仓位降为 0.6，否则保持满仓。候选必须明确说明相对 Champion 只新增或替换了哪一个机制、它针对哪条风险路径，以及预期如何改变实际选股、持仓或暴露。

前两次 Run 的确定性经验如下。唯一晋级方案是简洁的“双向波动扩张 + 临时降持仓和总暴露”；永久或大范围低仓位、复杂信号堆叠没有可靠优势。低波慢跌补充门控（60 日趋势、负收益日占比）在 Gate 与 Champion 指标完全相同，说明新增逻辑没有形成有效行为差异；水下时长/回撤深度在 Development 内即耗尽。持仓相关性扩张和 risk-off 恢复闩锁曾显著改善 Development，却在 Gate 降低 Sortino；下行半波动、全宇宙相关扩张、市场宽度、回撤速度、纯回撤水平、连续仓位缩放、复杂迟滞、逆波动混合、过紧止损和激进长短周期混合也已被拒绝。不得原样重复这些实现或只围绕旧阈值局部搜索；只有提出与旧失败原因直接对应、可证伪的结构性修正时才可重用同一信号家族。

本 Run 的主方向从“继续增加全市场 risk-off 门控”转向“改善候选资产与组合构建本身”，使机制在正常和压力阶段都有足够行为样本。优先级一是稳健化横截面选择：在不堆叠多因子的前提下，研究单一、因果清晰的个券级风险质量修正，例如对近期下行路径、估计不稳定或动量衰减进行简单过滤或惩罚，避免高 Sharpe 但脆弱的资产进入组合。优先级二是改进组合层分散：研究以预备持仓为对象的边际集中度控制或相关性惩罚，替代固定 0.9 的二元剔除；这必须直接改变资产组合，而不是再次用相关性比做全仓降风险门控。优先级三是减少边际换仓和假突破：可以研究轻量的入选/保留缓冲，但风险恶化时必须允许快速退出，不能用普遍延迟恢复换取表面稳定。若有更清晰的单一机制也可探索，但应优先选择能持续改变组合质量、而非仅在极少日期触发的方案。

每轮只验证一个机制。提交前先量化候选相对 Champion 在 Development 的不同信号日、持仓变化、总暴露、触发次数和换手变化；若行为几乎等价，应停止该机制而不是提交。还应检查改善是否跨越多个预先存在的市场阶段，而非由单一事件贡献；这些诊断只用于稳健性判断，不得改变固定 evaluator、数据区间、Gate 或晋级规则，也不得根据诊断结果反复切分区间挖参数。参数应少且有经济含义，并检查少量合理邻近设定，避免尖点最优。

首要目标是在保留风险偏好恢复后上行参与能力的同时，减少深度回撤和连续亏损；不得仅靠长期降低总仓位抬高风险指标。保留 select(daily, universe, start, end) 接口，返回包含 date、symbol 和 target_weight 的 pandas DataFrame。策略必须纯多头并允许现金，每个信号日只能使用当时已可获得的信息，不得使用未来数据。所有候选使用固定资金、整手规则和交易费率。在满足最低收益、最大回撤和平均换手率约束后，以 Sortino 为唯一晋级目标；优先选择机制简单、行为差异充分、可解释且对合理邻近参数不敏感的方案。
"""

[budget]
max_rounds = 6
max_hours = 4
max_consecutive_failures = 3
round_minutes = 30

[opencode]
model = "xai/grok-4.5"
variant = "high"
timeout_minutes = 30

[strategy]
name = "sharpe-corr-threshold"
module = "quant_core.strategy.sharpe_corr_threshold"

[baseline]
mode = "workspace"

[data]
universe = "universes/sector_rotation.csv"

[parameter_selection]
train_months = 18
objective = "sortino"
max_parameter_sets = 256

[parameter_selection.schedule]
period = "calendar_month"
interval = 1
trigger = "start"

[parameter_selection.constraints]
annual_return = { operator = ">=", threshold = 0.05 }
max_drawdown = { operator = "abs<=", threshold = 0.15 }
avg_turnover = { operator = "<=", threshold = 0.30 }

[scope]
editable = [
  "src/quant_core/strategy/sharpe_corr_threshold.py",
]
forbidden = [
  "src/quant_core/backtest/",
  "src/quant_core/data/",
  "src/quant_core/research/",
  "src/quant_core/cli.py",
  "src/quant_core/config.py",
  "tests/",
  "data/",
  "outputs/",
  ".agents/",
  ".research/",
]

[commands]
test = ["{python}", "-m", "pytest", "-q", "tests/test_sector_rotation_research.py"]
backtest = [
  "{python}", "-m", "quant_core.research.evaluator",
  "--universe", "{universe}",
  "--start", "{start}",
  "--end", "{end}",
  "--run-id", "{run_id}",
  "--candidate-module", "{strategy_module}",
]
metrics_path = "outputs/backtests/{run_id}/metrics.json"

[evaluation]
mode = "walk_forward"

[evaluation.contract]
paths = [
  "pyproject.toml",
  "src/quant_core/__init__.py",
  "src/quant_core/backtest",
  "src/quant_core/config.py",
  "src/quant_core/data",
  "src/quant_core/factors",
  "src/quant_core/research",
  "src/quant_core/schedule.py",
  "src/quant_core/strategy/__init__.py",
  "tests/test_sector_rotation_research.py",
  "universes/sector_rotation.csv",
]

[evaluation.acceptance]
minimum_improvement = 0.03

[evaluation.walk_forward.development]
start = "2021-07-19"
end = "2025-07-17"

[evaluation.walk_forward.gate]
start = "2025-07-18"
end = "2026-07-17"
