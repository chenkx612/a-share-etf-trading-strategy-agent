id = "active-etf-sharpe"
goal = """
在固定的 universes/active_etf_rotation.csv 候选池上继续研发并评估
sharpe-corr-threshold 纯多头 ETF 轮动策略，替代任何按全样本后验收益筛选的股票池。
本任务使用独立 task id；不得继承旧 sector_rotation.csv 股票池下的 Champion、参数结论、
Gate 指标或研究记忆。后续 Run 必须以 Harness 管理并同步到工作区的本任务当前 Champion
作为 Parent，不得重置为任务创建前的工作区基线。

当前 Parent 是 Run 005 / Round 004 晋级并同步到工作区的 Champion 组合体：滚动 Sharpe
负责准入，Sharpe / rolling_vol^vol_power 负责排序，sticky 再平衡期间只响应止损退出，
max_gross 按 top_n 槽位等权且空槽持有现金，soft-correlation 贪心选择负责分散，止损后的
ETF 在 cooloff_days 内禁止重新进入；相关性使用真实成对观测并要求
min_pair_observations，soft-correlation 惩罚还包含截面 median mix。当前 parameter_grid
固定 sharpe_window=25、factor_lower_bound=0.25、corr_window=100、corr_lambda=4、
vol_window=15、vol_power=1.5、max_gross=0.75、stop_loss_pct=0.10、rebalance_every=5、
cooloff_days=5、min_pair_observations=40，并搜索 top_n={3,4}、
corr_pen_median_mix={0,0.25}。历史接受补丁均被 facts 判为 combined_change；这些结构只能
作为待继续改进的整体，不得把历史表现归因于 sticky、soft correlation、波动率缩放、
观测感知相关、median mix、参数重配或 cooloff 中的任一单独机制。后续每轮只改变一个
可证伪的主要机制，保持其余 Parent 逻辑不变，并用最小补丁和小型、确定的参数网格建立
清晰对照；候选网格必须保留至少一个精确 Parent 锚点，避免把移除当前可行配置误当作新机制效果。

Run 005 及更早记录使用 Sortino 作为参数选择和晋级目标，当前任务契约已经切换为 Sharpe。
旧 Run 的精确 Gate 指标只属于不可变历史，不是现行 Sharpe 契约下可直接比较的 Parent 基准；
新 Run 必须让 Harness 按当前冻结数据、Evaluator、环境和任务契约检查指标适用性并在需要时
重评 Parent。不得手工搬用、换算或推断旧 Sortino Gate 表现，也不得因目标切换而回退 Champion、
放宽硬约束或原样重跑已拒候选。后续研发判断以新 Run 暴露的 Development 证据及 Harness
持有的现行 Parent 比较为准。

下一阶段优先改善 Development walk-forward 的跨折稳健性和训练窗参数可行性。Run 005 的
Champion 有 8 个 Development 训练折找不到满足硬约束的参数；官方诊断显示这些折全部受
annual_return 约束影响，其中多折同时受 max_drawdown 约束影响，avg_turnover 从未成为瓶颈。
该诊断来自旧冻结区间；新 Run 先在当前相对区间和 Sharpe 契约下复核失败折、约束余量与 Parent
参数选择，再提出作用路径直接对应的候选。减少 no_feasible_parameter_folds 是诊断目标，不是
绕过晋级条件的替代指标；候选仍须先满足硬约束，并在 Development 中显示相对 Parent 的可解释
Sharpe 改善，才值得提交 Gate。除聚合指标外，提交前还要检查改善是否分布在多个验证折、参数
是否集中于单个边界点、相邻参数是否方向一致，以及新增机制实际改变了多少持仓日、触发事件、
总暴露和换手；不得只凭全区间回测、最佳参数点或少数可行折送 Gate。

优先研究以下互斥 idea，每轮最多选择一个，不要求按顺序全部实现：

1. Sharpe 信号本身的估计稳健性。可仅稳健化滚动 Sharpe 的收益率分子，例如因果均值收缩、
   预先声明的 EWMA 或短长窗一致性惩罚，同时保持 15 日波动率分母、准入阈值、相关分散、
   槽位权重和退出状态机不变。必须量化排序变化与跨折效果，并区别于已拒绝的 rank persistence、
   downside z 惩罚、单纯改变 sharpe_window 或波动率分母。
2. 准入置信度。可仅把固定 Sharpe>0.25 准入改为使用截至信号日样本量和估计误差的确定性
   下置信界，或加入一个因果的双窗口一致性条件；排序和持仓逻辑保持 Parent 不变。候选须事先
   说明它如何同时处理低收益和回撤绑定，而不是简单增加空仓，并保留精确 Parent 锚点。
3. 相关性缺样本的不确定性处理。当前观测感知路径对不足 min_pair_observations 的 pair 给出
   缺失相关，并在 soft-correlation 选择中等效为零惩罚。可仅研究一个因果、确定的保守先验或
   向截面相关水平收缩的缺样本处理；保持 min_pair=40、median mix、corr_window、corr_lambda、
   rank factor 和持仓惯性不变，并重点量化新上市 ETF 的资格、惩罚和最终持仓变化。
4. 只有在新 Run 诊断仍明确显示 annual_return 与 max_drawdown 同时绑定时，才考虑一个连续、
   有上下界且完全因果的横截面 breadth 暴露刻度；不得使用二元 risk-off、未来市场状态或单独
   扩大 max_gross。该方向必须只改变总暴露，不得同时改排名、相关选择和退出逻辑，并证明不是
   通过普遍增持或普遍持现来机械移动单一约束。

既往已拒绝、放弃或未形成有效证据的路径包括：逆波动率持仓权重、max_new_names 换手帽、
downside z 惩罚、名称级 trailing drawdown、max_hold_days、rank persistence、较短
corr_window、较低 corr_lambda、较长 rebalance_every、post-stop gross redeploy、单纯较长
vol_window、incumbent hold_boost、二元趋势/波动 risk-off、截面或绝对波动率分母下限、
短长窗方差 shrinkage、soft-correlation 的 tanh 或 power 再变换，以及本地代理中未优于 Parent
的波动率标准化止损。不得只改名称或轻微改阈值后重复这些实现；若重新研究，必须说明新的失败
诊断、与旧实现不同的作用路径和可证伪预期。Harness 会提供不含精确 Gate 指标的既往研究历史；
不得尝试推断、读取或利用历史精确 Gate 表现来选择候选。

active_etf_rotation.csv 只决定允许参与的 symbol 集合。fund_size 是当前时点的审计字段，
不得进入历史打分、权重、阈值或参数选择。该 CSV 是当前成分快照，因此仍存在幸存者偏差；
本任务不宣称恢复历史成分。每个历史信号日只能动态纳入当日已有行情且满足所需滚动窗口的
ETF；不得填补上市前数据，不得后向填充，不得使用未来收益、未来成分、全样本统计量或
Development 之后的信息构造特征。所有信号只能使用交易日 t 收盘时已知的数据，目标权重
由固定回测器在 t+1 执行。

评估必须使用 Harness 固定的 walk-forward：每个自然月首个交易日以此前 12 个月为训练窗，
仅在训练窗内按硬约束和 Sharpe 选择 parameter_grid() 中的参数，然后将该参数冻结到随后
一个月的样本外验证折。Development 用于候选研发；Gate 与 Development 不重叠，Gate 的
逐折参数、持仓、收益和指标不得反馈给后续候选。不得修改 evaluator、数据区间、股票池、
硬约束、晋级规则或测试来配合候选。

策略模块必须保留 select(daily, universe, start, end)、parameter_grid() 和
select_with_params(daily, universe, start, end, params) 接口，返回至少包含 date、
symbol、target_weight 的 DataFrame。权重必须有限、非负且每日总和不超过 1，允许持有现金；
无持仓日也要通过 attrs 的 signal_dates 和 universe_symbols 表达完整状态。参数网格必须
确定、规模受限且具有经济含义。

每轮只验证一个主要机制。候选提交前须在 Development 中检查因果性、确定性、上市边界、
缺失行情、信号日至次日开盘时序、纯多头权重和参数网格唯一性，并量化相对当前 Champion
的持仓差异、触发次数、总暴露和换手变化。候选先满足年化收益、最大回撤和平均换手率约束，
再以 Gate 汇总 Sharpe 达到最小改善门槛；Promotion 完全由 Harness 决定。
"""

[budget]
max_rounds = 10
max_hours = 6
max_consecutive_failures = 3
round_minutes = 30

[opencode]
model = "xai/grok-4.5"
variant = "high"

[execution]
command_timeout_minutes = 10

[strategy]
name = "sharpe-corr-threshold"

[baseline]
mode = "workspace"

[data]
universe = "universes/active_etf_rotation.csv"

[parameter_selection]
train_months = 12
objective = "sharpe"
max_parameter_sets = 64

[parameter_selection.schedule]
period = "calendar_month"
interval = 1
trigger = "start"

[parameter_selection.constraints]
annual_return = { operator = ">=", threshold = 0.05 }
max_drawdown = { operator = "abs<=", threshold = 0.15 }
avg_turnover = { operator = "<=", threshold = 0.30 }

[production]
curve_months = 12
benchmark = "510300"

[production.data_requirements]
required_columns = [
  "date",
  "symbol",
  "name",
  "open",
  "high",
  "low",
  "close",
  "volume",
  "amount",
  "turnover",
]
min_history = 125

[scope]
editable = [
  "src/quant_core/strategy/sharpe_corr_threshold.py",
]

[commands]
tests = [
  "tests/test_sector_rotation_research.py",
  "tests/test_research_evaluator.py",
]

[evaluation]
mode = "walk_forward"

[evaluation.acceptance]
minimum_improvement = 0.03

[evaluation.guard]
benchmark = "universe_equal_weight"
max_excess_annual_return_degradation = 0.05

[evaluation.walk_forward.relative]
anchor = "latest_complete_universe_date"
development_months = 30
gate_months = 12
guard_months = 6
