id = "active-etf-sharpe"
goal = """
在固定的 universes/active_etf_rotation.csv 候选池上继续研发并评估每日重评、因果响应且
换手受控的 sharpe-corr-threshold 纯多头 ETF 轮动策略，替代任何按全样本后验收益筛选的股票池。
本任务使用独立 task id；不得继承旧 sector_rotation.csv 股票池下的 Champion、参数结论、
Gate 指标或研究记忆。后续 Run 必须以 Harness 管理并同步到工作区的本任务当前 Champion
作为 Parent，不得重置为任务创建前的工作区基线。

当前 Parent 是按截至 2026-08-27 的最新统一 Gate/Guard 诊断复评，从历史候选回滚的
Run 004 / Round 008 Champion 组合体：滚动 Sharpe 负责准入，
Sharpe / rolling_vol^vol_power 负责排序，多信号日 sticky 再平衡期间只响应止损退出，
max_gross 按 top_n 槽位等权且空槽持有现金，soft-correlation 贪心选择负责分散，止损后的
ETF 在 cooloff_days 内禁止重新进入。该版本的相关性沿用当时的缺失收益填零滚动估计，
不包含后续候选引入的 min_pair_observations、corr_pen_median_mix 或
missing_corr_prior_mix。当前 parameter_grid 固定 sharpe_window=25、
factor_lower_bound=0.25、corr_window=100、corr_lambda=4、vol_window=15、
vol_power=1.5、max_gross=0.75、stop_loss_pct=0.10，并搜索 top_n={3,4}、
rebalance_every={5,10}、cooloff_days={5,10}。历史接受补丁均被 facts 判为
combined_change；这些结构只能作为待继续改进的整体，不得把历史表现归因于 sticky、
soft correlation、波动率缩放、参数重配或 cooloff 中的任一单独机制。后续每轮只改变一个
可证伪的主要机制，保持其余 Parent 逻辑不变，并用最小补丁和小型、确定的参数网格建立
清晰对照。Development 对照必须保留精确 Parent 参数集，避免把移除当前可行配置误当作新机制
效果；但确认日频机制可行后，拟提交晋级的最终 parameter_grid 必须只包含每日决策配置，避免
Walk-Forward 在部分月份重新选回 rebalance_every={5,10} 而名义上宣称已经日频化。

本阶段的明确产品目标是把迟钝的多日 Parent 改造成真正灵活的每日决策策略。这里的“灵活”不是
仅把数据频率、输出行频率或参数名称称为日频，而是每个有效交易日都必须使用当日收盘前可得信息
重新计算完整的准入集合、排序、相关分散和目标持仓，并由固定回测器在 t+1 执行。拟晋级策略必须
采用 rebalance_every=1 或语义等价的每日状态机，不得依靠固定 5/10 日时钟跳过决策。

灵活性的最低验收标准是：所有有效信号日的 decision_evaluation_coverage=100%；准入失败、止损和
预先声明的重大目标变化不得因日历锁定延迟，首次可执行动作延迟不得超过 1 个信号日至下一开盘；
允许重新评估后保持原仓，也允许用因果的入场/退出分带、分数优势阈值或部分更新抑制边际抖动，
但每次“不交易”都必须能由当日状态和预声明规则解释，而不是 days_since_rebalance 尚未到期。
候选必须报告相对 Parent 的 stale_holding_days、decision_delay_days 分布、当日目标变化覆盖率、
实际改变持仓日比例、进入/退出触发次数、平均总暴露和换手增量。响应更快只是产品资格，不替代
Sharpe 晋级条件；不得放宽 avg_turnover、annual_return、max_drawdown、Gate 或 Guard。

Run 005 及更早记录使用 Sortino 作为参数选择和晋级目标，当前任务契约已经切换为 Sharpe。
旧 Run 的精确 Gate 指标只属于不可变历史，不是现行 Sharpe 契约下可直接比较的 Parent 基准；
新 Run 必须让 Harness 按当前冻结数据、Evaluator、环境和任务契约检查指标适用性并在需要时
重评 Parent。不得手工搬用、换算或推断旧 Sortino Gate 表现，也不得因目标切换而回退 Champion、
放宽硬约束或原样重跑已拒候选。后续研发判断以新 Run 暴露的 Development 证据及 Harness
持有的现行 Parent 比较为准。

下一阶段优先验证每日重新评估能否在行情转折时更快改变持仓，同时维持 Development
walk-forward 的跨折稳健性和训练窗参数可行性。新 Run 先在当前相对区间和 Sharpe 契约下量化
Parent 的多日锁定造成的响应延迟：逐日记录完整日频目标与实际 Parent 持仓的首次分叉、延迟天数、
期间机会收益、回撤和换手；这些 Development 诊断不得读取或推断 Gate。首个候选只改变决策频率，
不得同时改 Sharpe 公式、相关性估计、权重、止损、cooloff 或总暴露。先用包含精确 Parent 参数集的
开发网格建立因果对照；若纯日频基线可行，再将最终提交网格收敛为 rebalance_every=1 的小型配置。
若机械日频带来不必要换手，后续轮次才可基于触发日志逐轮研究一个因果的换仓确认机制，但仍须每日
生成完整目标，不得重新引入多日静默锁定。候选仍须先满足硬约束，并在 Development 中显示相对
Parent 的可解释 Sharpe 改善，才值得提交 Gate。除聚合指标外，提交前还要检查改善是否分布在多个
验证折、日频配置是否在训练折中稳定可行、参数是否集中于单个边界点、相邻参数是否方向一致；
不得只凭全区间回测、最佳参数点、响应速度本身或少数可行折送 Gate。

优先研究以下互斥 idea，每轮最多选择一个，不要求按顺序全部实现：

1. 纯日频再评估基线。只把 Parent 的 rebalance_every={5,10} 改为 1，保持其余 Parent 参数、信号、
   排序、相关分散、权重、止损和 cooloff 状态机不变。开发对照网格包含精确 Parent 与日频镜像；
   拟提交版本只保留日频配置。必须量化提前换仓事件、响应延迟、换手增量和跨折 Sharpe。
2. 日频入场/退出分带。仅在每日完整重评之后，为在持仓和候选使用不同但预声明的分数边界；
   准入失败与止损仍即时退出。分带必须基于当日因果分数，不能退化为固定持有天数。
3. 日频换仓优势阈值。仅当新候选相对被替换持仓达到小型、确定的分数优势才换仓；必须记录每天
   被阈值拦截的目标变化及后续结果，用以证明它过滤边际抖动而非掩盖响应迟钝。
4. 日频部分更新。每日生成完整目标组合，但每个交易日最多替换确定数量的最低质量持仓；准入失败
   和止损不受数量限制。须比较完整日频与部分更新的决策延迟、遗漏机会、回撤和换手。
5. 日频转折确认。只有纯日频基线证明存在大量单日反转噪声时，才研究一个截至 t 日连续更新的
   确认分数或连续两日条件；确认后必须立即行动，不得使用未来收益或重新引入日历锁定。

既往已拒绝、放弃或未形成有效证据的路径包括：逆波动率持仓权重、max_new_names 换手帽、
downside z 惩罚、名称级 trailing drawdown、max_hold_days、rank persistence、较短
corr_window、较低 corr_lambda、较长 rebalance_every、post-stop gross redeploy、单纯较长
vol_window、incumbent hold_boost、二元趋势/波动 risk-off、截面或绝对波动率分母下限、
短长窗方差 shrinkage、soft-correlation 的 tanh 或 power 再变换，以及本地代理中未优于 Parent
的波动率标准化止损。不得只改名称或轻微改阈值后重复这些实现；若重新研究，必须说明新的失败
诊断、与旧实现不同的作用路径和可证伪预期。Harness 会提供不含精确 Gate 指标的既往研究历史；
不得尝试推断、读取或利用历史精确 Gate 表现来选择候选。

active_etf_rotation.csv 只决定允许参与的 symbol 集合。fund_size 是当前时点的审计字段，
不得进入历史打分、权重、阈值或参数选择。该 CSV 是当前成分快照，因此仍存在幸存者偏差；
本任务不宣称恢复历史成分。每个历史信号日只能动态纳入当日已有行情且满足所需滚动窗口的
ETF；不得填补上市前数据，不得后向填充，不得使用未来收益、未来成分、全样本统计量或
Development 之后的信息构造特征。所有信号只能使用交易日 t 收盘时已知的数据，目标权重
由固定回测器在 t+1 执行。

评估必须使用 Harness 固定的 walk-forward：每个自然月首个交易日以此前 12 个月为训练窗，
仅在训练窗内按硬约束和 Sharpe 选择 parameter_grid() 中的参数，然后将该参数冻结到随后
一个月的样本外验证折。Development 用于候选研发；Gate 与 Development 不重叠，Gate 的
逐折参数、持仓、收益和指标不得反馈给后续候选。不得修改 evaluator、数据区间、股票池、
硬约束、晋级规则或测试来配合候选。

策略模块必须保留 select(daily, universe, start, end)、parameter_grid() 和
select_with_params(daily, universe, start, end, params) 接口，返回至少包含 date、
symbol、target_weight 的 DataFrame。权重必须有限、非负且每日总和不超过 1，允许持有现金；
无持仓日也要通过 attrs 的 signal_dates 和 universe_symbols 表达完整状态。参数网格必须
确定、规模受限且具有经济含义。

每轮只验证一个主要机制。候选提交前须在 Development 中检查因果性、确定性、上市边界、
缺失行情、信号日至次日开盘时序、纯多头权重和参数网格唯一性，并量化相对当前 Champion
的持仓差异、触发次数、总暴露和换手变化。候选先满足年化收益、最大回撤和平均换手率约束，
再以 Gate 汇总 Sharpe 达到最小改善门槛；Promotion 完全由 Harness 决定。
"""

[budget]
max_rounds = 10
max_hours = 6
max_consecutive_failures = 3
round_minutes = 30

[opencode]
model = "xai/grok-4.5"
variant = "high"

[execution]
command_timeout_minutes = 10

[strategy]
name = "sharpe-corr-threshold"

[baseline]
mode = "workspace"

[data]
universe = "universes/active_etf_rotation.csv"

[parameter_selection]
train_months = 12
objective = "sharpe"
max_parameter_sets = 64

[parameter_selection.schedule]
period = "calendar_month"
interval = 1
trigger = "start"

[parameter_selection.constraints]
annual_return = { operator = ">=", threshold = 0.05 }
max_drawdown = { operator = "abs<=", threshold = 0.15 }
avg_turnover = { operator = "<=", threshold = 0.30 }

[production]
curve_months = 12
benchmark = "510300"

[production.data_requirements]
required_columns = [
  "date",
  "symbol",
  "name",
  "open",
  "high",
  "low",
  "close",
  "volume",
  "amount",
  "turnover",
]
min_history = 125

[scope]
editable = [
  "src/quant_core/strategy/sharpe_corr_threshold.py",
]

[commands]
tests = [
  "tests/test_sector_rotation_research.py",
  "tests/test_research_evaluator.py",
]

[evaluation]
mode = "walk_forward"

[evaluation.acceptance]
minimum_improvement = 0.03

[evaluation.guard]
benchmark = "universe_equal_weight"
max_excess_annual_return_degradation = 0.05

[evaluation.walk_forward.relative]
anchor = "latest_complete_universe_date"
development_months = 30
gate_months = 12
guard_months = 6
